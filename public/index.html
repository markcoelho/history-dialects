<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Event Describer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>History Tellers</h1>
      <p>Learn about any historical event with different characters and dialects</p>
      <p>Computational Creativity for Design 2025</p>
    </header>
    <main>
      <div class="main-container">
        <div class="left-column">
          <form id="eventForm">
            <div class="input-group">
              <label for="event">Write an Event or Person from History:</label>
              <input
                type="text"
                id="event"
                placeholder="E.g., Moon Landing, French Revolution, Cleopatra, ..."
                required
              />
            </div>

            <div class="input-group">
              <label for="style">Pick someone to explain</label>
              <div class="scrollable-container">
                <div class="style-grid" id="styleGrid">
                  <!-- Style options will be dynamically loaded from config.json -->
                </div>
              </div>
              <input type="hidden" id="style" name="style" required />
            </div>

            <button type="submit">Describe Event</button>
          </form>
        </div>

        <div class="right-column" id="result">
          <!-- Result will be dynamically inserted here by script.js -->
        </div>
      </div>
    </main>

    <!-- Load config first, then the other scripts -->
    <script src="loadConfig.js"></script>
    <script src="script.js"></script>
    <script src="select.js"></script>
  </body>
</html>
